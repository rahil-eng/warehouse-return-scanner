
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Warehouse Return Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      background: #f4f6f9;
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      color: #172033;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
    }

    h1 {
      font-size: 24px;
      margin: 12px 0 6px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
      margin-bottom: 22px;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 15px;
      box-shadow: 0 4px 16px rgba(0,0,0,.04);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 12px;
    }

    #reader video {
      width: 100%;
      border-radius: 12px;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 10px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      border-radius: 10px;
      padding: 15px;
      font-size: 16px;
      font-weight: 600;
      margin: 5px 0;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .secondary {
      background: #334155;
    }

    #status {
      padding: 17px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .ready {
      background: #e2e8f0;
      color: #334155;
    }

    .loading {
      background: #fef3c7;
      color: #92400e;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    #mode {
      font-size: 12px;
      font-weight: bold;
      letter-spacing: .5px;
      padding: 8px;
      color: #64748b;
    }

    .small {
      color: #64748b;
      font-size: 12px;
      margin-top: 12px;
    }
  </style>
</head>

<body>
<div class="container">

  <h1>Warehouse Return Scanner</h1>
  <div class="subtitle">
    Scan USPS return labels using your phone.
  </div>

  <div class="panel">
    <input
      id="accessCode"
      type="password"
      placeholder="Warehouse access code"
      autocomplete="off"
    >

    <div id="mode">WAREHOUSE SCANNER</div>
    <div id="reader"></div>

    <button id="startButton" onclick="startCamera()">
      Start Camera
    </button>

    <button class="secondary"
            onclick="stopCamera()">
      Stop Camera
    </button>
  </div>

  <div id="status" class="ready">
    Enter warehouse code and start camera.
  </div>

  <div class="panel" style="margin-top:18px">
    <div class="subtitle">
      Barcode not scanning?
    </div>

    <input
      id="manualBarcode"
      placeholder="Enter tracking number manually"
      autocomplete="off"
    >

    <button onclick="manualSubmit()">
      Submit Tracking Number
    </button>
  </div>

  <p class="small">
    Refunds and exchanges are handled securely by Loop.
  </p>

</div>

<script>
  // REPLACE THIS WITH YOUR CLOUDFLARE WORKER URL
  const API_URL =
  "https://warehouse-scanner-bridge.rahil-570.workers.dev";

  const scanner = new Html5Qrcode("reader");

  let cameraRunning = false;
  let busy = false;
  let audioContext = null;

  const statusEl = document.getElementById("status");
  const startButton = document.getElementById("startButton");

  function showStatus(type, message) {
    statusEl.className = type;
    statusEl.textContent = message;
  }

  function playBeep(frequency) {
    try {
      const Audio = window.AudioContext ||
                    window.webkitAudioContext;

      if (!audioContext) {
        audioContext = new Audio();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const osc = audioContext.createOscillator();
      const gain = audioContext.createGain();

      osc.connect(gain);
      gain.connect(audioContext.destination);

      osc.frequency.value = frequency;
      gain.gain.value = 0.12;

      osc.start();
      osc.stop(audioContext.currentTime + .15);
    } catch (_) {}
  }

  async function startCamera() {
    if (busy || cameraRunning) return;

    if (!document.getElementById("accessCode").value.trim()) {
      showStatus("error", "Enter your warehouse access code.");
      return;
    }

    startButton.disabled = true;

    try {
      if (audioContext &&
          audioContext.state === "suspended") {
        await audioContext.resume();
      }

     
await scanner.start(
  { facingMode: "environment" },
  {
    fps: 15,
    aspectRatio: 1.777778,
    disableFlip: true,
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF,
      Html5QrcodeSupportedFormats.QR_CODE,
      Html5QrcodeSupportedFormats.DATA_MATRIX
    ]
  },
  onScanSuccess,
  function() {}
);


      cameraRunning = true;

      showStatus(
        "ready",
        "Camera active. Position the barcode in the frame."
      );

    } catch (error) {
      showStatus(
        "error",
        "Camera error: " + error.message
      );
    } finally {
      startButton.disabled = false;
    }
  }

  async function stopCamera() {
    if (!cameraRunning) return;

    try {
      await scanner.stop();
    } catch (_) {}

    cameraRunning = false;
  }

  function onScanSuccess(text) {
    if (busy) return;
    submitBarcode(text);
  }

  function manualSubmit() {
    const text = document.getElementById("manualBarcode")
      .value.trim();

    if (!text) {
      showStatus("error", "Enter a tracking number.");
      return;
    }

    submitBarcode(text);
  }

  async function submitBarcode(barcode) {
    if (busy) return;

    busy = true;

    const accessCode = document.getElementById("accessCode")
      .value.trim();

    if (!accessCode) {
      showStatus("error", "Warehouse access code required.");
      busy = false;
      return;
    }

    playBeep(850);

    showStatus(
      "loading",
      "Barcode detected. Checking return in Loop..."
    );

    await stopCamera();

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        cache: "no-store",
        body: JSON.stringify({
          barcode: barcode,
          accessCode: accessCode
        })
      });

      const result = await response.json();

      if (result.ok) {
        playBeep(1100);
        showStatus("success", result.message);
      } else {
        playBeep(230);
        showStatus("error", result.message);
      }

    } catch (_) {
      playBeep(230);

      showStatus(
        "error",
        "Connection error. Check the Google Sheet before " +
        "attempting this return again."
      );
    }

    document.getElementById("manualBarcode").value = "";

    busy = false;

    // Camera remains stopped so the result can be reviewed.
    // Tap Start Camera to scan the next package.
  }
</script>
</body>
</html>
