
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">

  <title>Warehouse Return Scanner</title>

  <script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont,
                   "Segoe UI", Arial, sans-serif;
      margin: 0;
      padding: 18px;
      background: #f4f6f9;
      color: #172033;
      text-align: center;
    }

    .container {
      max-width: 480px;
      margin: auto;
    }

    h1 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .subtitle {
      color: #64748b;
      font-size: 14px;
    }

    .panel {
      background: white;
      padding: 16px;
      border-radius: 15px;
      margin-top: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
    }

    #reader {
      width: 100%;
      overflow: hidden;
      border-radius: 10px;
    }

    #reader video {
      width: 100%;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 16px;
      border: 1px solid #cbd5e1;
      border-radius: 9px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 600;
      margin-top: 8px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
    }

    .secondary {
      background: #334155;
    }

    #status {
      margin-top: 18px;
      padding: 17px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: bold;
      overflow-wrap: anywhere;
    }

    .ready {
      background: #e2e8f0;
      color: #334155;
    }

    .loading {
      background: #fef3c7;
      color: #92400e;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    .small {
      color: #64748b;
      font-size: 12px;
      margin-top: 12px;
    }

    #lastScan {
      font-size: 13px;
      color: #475569;
      margin-top: 10px;
      overflow-wrap: anywhere;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Warehouse Return Scanner</h1>

  <p class="subtitle">
    Scan the long USPS tracking barcode.
  </p>

  <div class="panel">

    <input
      id="accessCode"
      type="password"
      placeholder="Warehouse access code"
      autocomplete="off"
    >

    <div id="reader"></div>

    <button id="startButton" onclick="startCamera()">
      Start Camera
    </button>

    <button class="secondary" onclick="stopCamera()">
      Stop Camera
    </button>

    <div id="lastScan"></div>

  </div>

  <div id="status" class="ready">
    Enter access code and start camera.
  </div>

  <div class="panel">

    <p class="subtitle">
      Barcode damaged? Enter tracking number manually.
    </p>

    <input
      id="manualBarcode"
      placeholder="USPS tracking number"
      autocomplete="off"
      inputmode="numeric"
    >

    <button onclick="manualSubmit()">
      Submit Tracking Number
    </button>

  </div>

  <p class="small">
    Scans are saved to Google Sheets.
    Loop processing runs in the background.
  </p>

</div>

<script>

  // CLOUDFLARE WORKER
  const API_URL =
    "https://warehouse-scanner-bridge.rahil-570.workers.dev";

  // Only scan linear shipping barcodes.
  // Ignore QR codes and square 2D barcodes.
  const scanner = new Html5Qrcode("reader", {
    formatsToSupport: [
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.CODE_39,
      Html5QrcodeSupportedFormats.ITF
    ],
    useBarCodeDetectorIfSupported: true,
    verbose: false
  });

  let cameraRunning = false;
  let cameraStarting = false;
  let busy = false;
  let audioContext = null;
  let restartTimer = null;

  const statusEl = document.getElementById("status");
  const startButton = document.getElementById("startButton");

  function showStatus(type, message) {
    statusEl.className = type;
    statusEl.textContent = message;
  }

  function playBeep(frequency, duration = 0.15) {
    try {
      const AudioClass =
        window.AudioContext ||
        window.webkitAudioContext;

      if (!audioContext) {
        audioContext = new AudioClass();
      }

      if (audioContext.state === "suspended") {
        audioContext.resume();
      }

      const oscillator = audioContext.createOscillator();
      const gain = audioContext.createGain();

      oscillator.connect(gain);
      gain.connect(audioContext.destination);

      oscillator.frequency.value = frequency;
      gain.gain.value = 0.1;

      oscillator.start();
      oscillator.stop(
        audioContext.currentTime + duration
      );

    } catch (error) {
      // Audio is optional.
    }
  }

  // Accept this warehouse's USPS tracking format:
  // 22 digits starting with 9.
  //
  // The long barcode may contain 420 + ZIP routing
  // information before the actual tracking number.
  //
  // We deliberately send the original scanned barcode
  // to Apps Script, which already handles matching.

  function extractUspsTracking(value) {
    const raw = String(value || "").trim();

    // Reject binary data, letters and control characters.
    if (!/^[0-9\s]+$/.test(raw)) {
      return null;
    }

    const digits = raw.replace(/\s/g, "");

    // Standard printed 22-digit tracking number.
    if (/^9\d{21}$/.test(digits)) {
      return digits;
    }

    // Full USPS barcode with 420 routing prefix.
    // Accept only the 22-digit tracking suffix.
    if (
      digits.startsWith("420") &&
      (digits.length === 30 || digits.length === 34)
    ) {
      const tracking = digits.slice(-22);

      if (/^9\d{21}$/.test(tracking)) {
        return tracking;
      }
    }

    return null;
  }

  async function startCamera() {
    if (busy || cameraRunning || cameraStarting) return;

    clearTimeout(restartTimer);

    const accessCode = document.getElementById("accessCode")
      .value.trim();

    if (!accessCode) {
      showStatus(
        "error",
        "Enter warehouse access code first."
      );
      return;
    }

    cameraStarting = true;
    startButton.disabled = true;

    try {
      await scanner.start(
        { facingMode: "environment" },
        {
          fps: 15,
          aspectRatio: 1.777778,
          disableFlip: true
        },
        onScanSuccess,
        function() {}
      );

      cameraRunning = true;

      showStatus(
        "ready",
        "Scanner ready. Point at the long USPS barcode."
      );

    } catch (error) {
      showStatus(
        "error",
        "Camera error: " + error.message
      );

    } finally {
      cameraStarting = false;
      startButton.disabled = false;
    }
  }

  async function stopCamera() {
    clearTimeout(restartTimer);

    if (!cameraRunning) return;

    try {
      await scanner.stop();
    } catch (error) {}

    cameraRunning = false;
  }

  // Ignore unrelated barcodes without stopping camera.
  function onScanSuccess(decodedText) {
    if (busy) return;

    const tracking = extractUspsTracking(decodedText);

    if (!tracking) {
      // Ignore 2D data or unrelated barcode formats.
      return;
    }

    document.getElementById("lastScan").textContent =
      "Tracking detected: " + tracking;

    submitBarcode(decodedText);
  }

  function manualSubmit() {
    const input = document.getElementById("manualBarcode");
    const value = input.value.trim();

    const tracking = extractUspsTracking(value);

    if (!tracking) {
      showStatus(
        "error",
        "Enter a valid 22-digit USPS tracking number."
      );
      return;
    }

    submitBarcode(tracking);
  }

  async function submitBarcode(barcode) {
    if (busy) return;

    busy = true;

    const accessCode = document.getElementById("accessCode")
      .value.trim();

    if (!accessCode) {
      showStatus(
        "error",
        "Warehouse access code required."
      );
      busy = false;
      return;
    }

    playBeep(850);

    showStatus(
      "loading",
      "Barcode detected. Saving scan..."
    );

    await stopCamera();

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        cache: "no-store",
        body: JSON.stringify({
          barcode: barcode,
          accessCode: accessCode
        })
      });

      const result = await response.json();

      if (!response.ok || !result.ok) {
        playBeep(230, 0.3);

        showStatus(
          "error",
          result.message || "Scan not accepted."
        );

        busy = false;
        return;
      }

      playBeep(1100);

      showStatus(
        "success",
        result.dryRun
          ? result.message
          : "SCAN ACCEPTED - Order " +
            result.orderName +
            ". Saved for background processing."
      );

      document.getElementById("manualBarcode").value = "";

      busy = false;

      // Automatically prepare for the next package
      // after Google Sheets confirms the scan was saved.
      restartTimer = setTimeout(function() {
        startCamera();
      }, 1200);

    } catch (error) {
      playBeep(230, 0.3);

      showStatus(
        "error",
        "Connection error. Check Return Scans before retrying."
      );

      busy = false;
    }
  }

</script>
</body>
</html>
